name: Scrape Entreprises API

concurrency:
  group: scraping-pipeline-${{ github.ref }}
  cancel-in-progress: false

on:
  # schedule:
  #   - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  scrape_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Ensure we pull the latest head, not the commit that triggered the workflow
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests huggingface_hub

      - name: Sync latest checkpoints and Run Scraper
        run: |
          # Final pull to ensure any run that finished seconds ago is integrated
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          python process_all_batches.py

      - name: Upload State Snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraping-state-${{ github.run_id }}
          path: |
            data_api/processed_index/
            data_api/*.checkpoint
          if-no-files-found: ignore

